[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "change-readiness-agent"
version = "0.1.0"
description = "AI-powered cloud change readiness assessment using local LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Taiwo" },
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
